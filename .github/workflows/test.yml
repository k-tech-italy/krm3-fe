name: Run Tests and check Version

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
  version-check:
    runs-on: ubuntu-latest
    needs: test
    # Only releases (develop -> master PRs) must bump the version
    if: github.event_name == 'pull_request' && github.base_ref == 'master' && github.head_ref == 'develop'

    steps:
      - name: Checkout current code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # PR merge commit and its first parent (master tip)

      - name: Check versions
        run: chmod u+x check_versions.sh && ./check_versions.sh

      - name: Version check passed
        run: |
          echo "🎉 Version check passed! Ready to proceed with deployment or further steps."
